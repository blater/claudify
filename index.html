<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Claudify turns ordinary prose into deterministic, over-engineered AI-writing parody.">
  <title> Deterministic prose inflation for people who have seen one load bearing pivotal landscape too many.
  </title>
  <link rel="stylesheet" href="styles.css?v=source-tabs-20260902">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#main">Claudify<span aria-hidden="true">↗</span></a>
    <p>Paste English prose. Make it Linked-in share-ready.</p>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Honest. Seamy. Load Bearing.</p>
      <h1 id="page-title">
        <span class="title-word title-word-small">Agentify</span>
        <span class="title-word title-word-small">Intentify</span>
        <span class="title-word title-word-large"><b>Claudify</b></span>
      </h1>
      <p>
    </section>

    <div class="workspace">
      <section class="panel input-panel" aria-labelledby="source-title">
        <div class="panel-heading">
          <div><span class="step">01</span><h2 id="source-title">Source</h2></div>
          <div class="small-actions example-controls"><div class="example-menu-wrap"><button id="example-button" class="quiet example-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="example-menu">Load example</button><div id="example-menu" class="example-menu" role="menu" hidden><button id="example-option-showcase" class="example-option" type="button" role="menuitemradio" aria-checked="true" data-example-id="showcase"><span>Claudify showcase</span><span aria-hidden="true">✓</span></button><button id="example-option-hamlet" class="example-option" type="button" role="menuitemradio" aria-checked="false" data-example-id="hamlet"><span>Hamlet soliloquy</span><span aria-hidden="true">✓</span></button><button id="example-option-orwell" class="example-option" type="button" role="menuitemradio" aria-checked="false" data-example-id="orwell"><span>Orwell's six rules</span><span aria-hidden="true">✓</span></button></div></div><button id="clear-button" class="quiet" type="button">Clear</button></div>
        </div>


        <div class="tabs source-tabs" role="tablist" aria-label="Source format">
          <button id="source-text-tab" role="tab" aria-selected="true" aria-controls="source-text-panel" data-source-tab="text">Source Text</button>
          <button id="source-url-tab" role="tab" aria-selected="false" aria-controls="source-url-panel" data-source-tab="url" tabindex="-1">Source URL</button>
        </div>

        <div id="source-text-panel" class="source-input-panel" role="tabpanel" aria-labelledby="source-text-tab">
          <textarea id="source-text" rows="10" placeholder="Paste sober, defensible prose here…"></textarea>
          <output id="source-score" class="source-score" aria-label="Source slop score" aria-live="polite"></output>
        </div>
        <div id="source-url-panel" class="source-input-panel" role="tabpanel" aria-labelledby="source-url-tab" hidden>
          <label for="source-url">Source URL</label>
          <div class="url-row">
            <input id="source-url" type="url" inputmode="url" placeholder="https://github.com/owner/repo/issues/123">
            <button id="load-url-button" class="secondary" type="button">Load</button>
          </div>
        </div>

        <button id="transform-button" class="primary" type="button" disabled>Claudify it <span aria-hidden="true">→</span></button>
        <p id="source-status" class="status" role="status" aria-live="polite"></p>
      </section>


      <section class="panel output-panel" aria-labelledby="result-title">
        <div class="panel-heading">
          <div><span class="step">02</span><h2 id="result-title">Result</h2></div>
        </div>

        <div class="tabs" role="tablist" aria-label="Output format">
          <button id="rich-tab" role="tab" aria-selected="true" aria-controls="rich-output" data-tab="rich">Rich output</button>
          <button id="markdown-tab" role="tab" aria-selected="false" aria-controls="markdown-output" data-tab="markdown" tabindex="-1">Markdown</button>
        </div>

        <article id="rich-output" class="rich-output" role="tabpanel" aria-labelledby="rich-tab" tabindex="0"></article>

        <textarea id="markdown-output" class="markdown-output" role="tabpanel" aria-labelledby="markdown-tab" tabindex="0" rows="10" readonly hidden></textarea>
        <p id="output-status" class="status" role="status" aria-live="polite"></p>
        <button id="copy-button" class="secondary" type="button" disabled>Copy Output</button>


        <aside class="signals" aria-labelledby="signals-title">
          <div><p class="eyebrow">Comedic transformation intensity</p><h3 id="signals-title">Slop score</h3></div>
          <output id="slop-score" aria-label="Slop score">—</output>
          <ul id="sign-tally" aria-label="Applied sign tally"></ul>
        </aside>
      </section>
    </div>
  </main>

  <footer>
    <a href="https://github.com/blater/claudify">Source: https://github.com/blater/claudify</a>
  </footer>

  <script type="module" src="src/app.js?v=source-score-20260902"></script>
</body>
</html>
